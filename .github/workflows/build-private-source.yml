      - name: Configure release signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          if "signingConfigs {" in text:
              raise SystemExit("Signing configuration already exists; refusing to duplicate it.")
          if "android {" not in text or "buildTypes {" not in text:
              raise SystemExit("Unexpected Gradle file structure; signing configuration was not changed.")
          text = text.replace("android {", """android {
              signingConfigs {
                  release {
                      storeFile file("baro-pos-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """, 1)
          import re
          marker = "buildTypes {"
          if marker not in text:
              raise SystemExit("Gradle buildTypes block not found; signing configuration was not changed.")
          before, after = text.split(marker, 1)
          match = re.search(r'(?m)^(\s*)(?:release|getByName\(["\']release["\']\))\s*\{', after)
          if match:
              indent = match.group(1)
              after = after[:match.end()] + "\n" + indent + "    signingConfig signingConfigs.release" + after[match.end():]
          else:
              after = "\n    release {\n        signingConfig signingConfigs.release\n    }\n" + after
          path.write_text(before + marker + after)
          PY
