          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          for BASE_VERSION in 1.4.0 1.4.1; do
            BASE_APK="Baro-POS-$BASE_VERSION.baseline.apk"
            curl --fail --location --retry 3 --silent --show-error \
              "https://github.com/ashdas10/baro-pos-releases/releases/download/v$BASE_VERSION/Baro-POS-$BASE_VERSION.apk" \
              --output "$BASE_APK"
            "$AAPT" dump permissions "$BASE_APK" > "Baro-POS-$BASE_VERSION.baseline.permissions.txt"
            "$AAPT" dump badging "$BASE_APK" > "Baro-POS-$BASE_VERSION.baseline.badging.txt"
            "$AAPT" dump xmltree "$BASE_APK" AndroidManifest.xml > "Baro-POS-$BASE_VERSION.baseline.manifest-tree.txt"
            "$APKSIGNER" verify --verbose --print-certs "$BASE_APK" > "Baro-POS-$BASE_VERSION.baseline.signer.txt"
            sha256sum "$BASE_APK" > "Baro-POS-$BASE_VERSION.baseline.sha256"
            BASE_CERT="$(awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}' "Baro-POS-$BASE_VERSION.baseline.signer.txt")"
            CURRENT_CERT="$(awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}' "Baro-POS-$BARO_VERSION.signer.txt")"
            test -n "$BASE_CERT"
            test -n "$CURRENT_CERT"
            if [ "$BASE_CERT" != "$CURRENT_CERT" ]; then
              echo "Release signing certificate differs from public $BASE_VERSION."
              exit 1
            fi
            diff -u "Baro-POS-$BASE_VERSION.baseline.permissions.txt" "Baro-POS-$BARO_VERSION.permissions.txt" > "Baro-POS-$BASE_VERSION-to-$BARO_VERSION.permissions-diff.txt" || true
            diff -u "Baro-POS-$BASE_VERSION.baseline.badging.txt" "Baro-POS-$BARO_VERSION.badging.txt" > "Baro-POS-$BASE_VERSION-to-$BARO_VERSION.badging-diff.txt" || true
            diff -u "Baro-POS-$BASE_VERSION.baseline.manifest-tree.txt" "Baro-POS-$BARO_VERSION.manifest-tree.txt" > "Baro-POS-$BASE_VERSION-to-$BARO_VERSION.manifest-tree-diff.txt" || true
            diff -u <(unzip -Z1 "$BASE_APK" | sort) <(sort "Baro-POS-$BARO_VERSION.packaged-files.txt") > "Baro-POS-$BASE_VERSION-to-$BARO_VERSION.packaged-files-diff.txt" || true
            # Compare the actual bytes of executable Android payloads and the
            # compiled manifest/resources, not merely their ZIP entry names.
            apk_payload_hashes() {
              local apk="$1"
              local output="$2"
              : > "$output"
              while IFS= read -r entry; do
                [ -n "$entry" ] || continue
                digest="$(unzip -p "$apk" "$entry" | sha256sum | cut -d ' ' -f 1)"
                printf '%s  %s\n' "$digest" "$entry" >> "$output"
              done < <(unzip -Z1 "$apk" | grep -E '^(AndroidManifest\.xml|resources\.arsc|classes([0-9]+)?\.dex|lib/[^/]+/[^/]+\.so)$' | sort)
            }
            apk_payload_hashes "$BASE_APK" "Baro-POS-$BASE_VERSION.baseline-native-payload-sha256.txt"
            apk_payload_hashes "Baro-POS-$BARO_VERSION.apk" "Baro-POS-$BARO_VERSION.native-payload-sha256.txt"
            diff -u "Baro-POS-$BASE_VERSION.baseline-native-payload-sha256.txt" "Baro-POS-$BARO_VERSION.native-payload-sha256.txt" > "Baro-POS-$BASE_VERSION-to-$BARO_VERSION.native-payload-diff.txt" || true
            rm -f "$BASE_APK"
          done
