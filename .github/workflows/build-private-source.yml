name: Build Baro POS Android Release APK
# Production release v1.4.0

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character commit SHA from the private BARO POS repository"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: baro-pos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate private source commit SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be an exact 40-character lowercase commit SHA."
            exit 1
          fi
      - name: Check out private BARO POS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ashdas10/baro-pos
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.BARO_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm ci
      - name: Validate native Android injection scripts
        run: python3 -m py_compile scripts/inject-android-upi-notifications.py scripts/inject-android-section-security-and-notifications.py
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Run transaction regression tests
        run: npm test
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Build web assets
        run: npm run build

  android-validation:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Validate private source commit SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be an exact 40-character lowercase commit SHA."
            exit 1
          fi
      - name: Check out private BARO POS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ashdas10/baro-pos
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.BARO_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run transaction regression tests
        run: npm test
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Build web assets
        run: npm run build
      - name: Create Android platform
        run: npx cap add android
      - name: Generate app icons
        run: |
          mkdir -p assets
          node --input-type=module -e "import sharp from 'sharp'; await sharp('public/cc-icon.svg').resize(1024,1024).png().toFile('assets/icon-only.png'); await sharp({create:{width:2732,height:2732,channels:4,background:'#062E24'}}).composite([{input:await sharp('public/cc-icon.svg').resize(900,900).png().toBuffer(),gravity:'centre'}]).png().toFile('assets/splash.png')"
          npx capacitor-assets generate --android --iconBackgroundColor '#062E24' --splashBackgroundColor '#062E24'
      - name: Sync Capacitor Android 8
        run: npx cap sync android
      - name: Add native in-app APK updater
        run: |
          mkdir -p android/app/src/main/java/com/baro/pos android/app/src/main/res/xml
          cat > android/app/src/main/java/com/baro/pos/ApkUpdaterPlugin.java <<'JAVA'
          package com.baro.pos;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          @CapacitorPlugin(name = "ApkUpdater")
          public class ApkUpdaterPlugin extends Plugin {
            private static final String MANIFEST = "https://github.com/ashdas10/baro-pos-releases/releases/latest/download/latest.json";
            private static final String APK_PREFIX = "https://github.com/ashdas10/baro-pos-releases/releases/download/";
            private static final String APK_LATEST_PREFIX = "https://github.com/ashdas10/baro-pos-releases/releases/latest/download/";
            private static final int MAX_APK_BYTES = 200 * 1024 * 1024;

            private static boolean isTrustedReleaseHost(Uri uri) {
              String host = uri.getHost();
              return "https".equalsIgnoreCase(uri.getScheme()) && host != null &&
                  (host.equalsIgnoreCase("github.com") ||
                   host.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                   host.equalsIgnoreCase("objects.githubusercontent.com")) &&
                  uri.getUserInfo() == null;
            }

            private HttpURLConnection openTrustedConnection(String address, String accept, int connectTimeout, int readTimeout) throws Exception {
              URL current = new URL(address);
              for (int redirects = 0; redirects <= 5; redirects++) {
                Uri uri = Uri.parse(current.toString());
                if (!isTrustedReleaseHost(uri)) throw new java.io.IOException("UPDATE_REDIRECT_REJECTED");
                HttpURLConnection next = (HttpURLConnection) current.openConnection();
                next.setConnectTimeout(connectTimeout);
                next.setReadTimeout(readTimeout);
                next.setInstanceFollowRedirects(false);
                next.setRequestProperty("Accept", accept);
                int status = next.getResponseCode();
                if (status >= 300 && status < 400) {
                  String location = next.getHeaderField("Location");
                  next.disconnect();
                  if (location == null || location.trim().isEmpty()) throw new java.io.IOException("UPDATE_REDIRECT_MISSING_LOCATION");
                  current = new URL(current, location);
                  continue;
                }
                return next;
              }
              throw new java.io.IOException("UPDATE_REDIRECT_LIMIT");
            }

            @PluginMethod public void checkForUpdate(PluginCall call) {
              new Thread(() -> {
                HttpURLConnection connection = null;
                try {
                  connection = openTrustedConnection(MANIFEST, "application/json", 15000, 15000);
                  int status = connection.getResponseCode();
                  if (status != HttpURLConnection.HTTP_OK) {
                    throw new java.io.IOException("UPDATE_CHECK_HTTP_" + status);
                  }
                  Uri finalUri = Uri.parse(connection.getURL().toString());
                  String finalHost = finalUri.getHost();
                  if (!"https".equals(finalUri.getScheme()) || finalHost == null ||
                      !(finalHost.equalsIgnoreCase("github.com") ||
                        finalHost.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                        finalHost.equalsIgnoreCase("objects.githubusercontent.com"))) {
                    throw new java.io.IOException("UPDATE_REDIRECT_REJECTED");
                  }
                  try (InputStream input = connection.getInputStream();
                       java.io.ByteArrayOutputStream output = new java.io.ByteArrayOutputStream()) {
                    byte[] buffer = new byte[4096];
                    int count;
                    while ((count = input.read(buffer)) != -1) {
                      if (output.size() + count > 1024 * 1024) throw new java.io.IOException("UPDATE_MANIFEST_TOO_LARGE");
                      output.write(buffer, 0, count);
                    }
                    JSONObject manifest = new JSONObject(output.toString("UTF-8"));
                    String version = manifest.optString("version", "");
                    String url = manifest.optString("apkUrl", "");
                    String checksum = manifest.optString("sha256", "");
                    if (version.isEmpty() || (!url.startsWith(APK_PREFIX) && !url.startsWith(APK_LATEST_PREFIX)) || !checksum.matches("(?i)[0-9a-f]{64}")) {
                      throw new java.io.IOException("UPDATE_MANIFEST_INVALID");
                    }
                    JSObject result = new JSObject();
                    result.put("update", manifest);
                    call.resolve(result);
                  }
                } catch (Exception error) {
                  call.reject("UPDATE_CHECK_FAILED: " + error.getMessage(), error);
                } finally {
                  if (connection != null) connection.disconnect();
                }
              }).start();
            }

            @PluginMethod public void openInstallPermissionSettings(PluginCall call) {
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O ||
                  getContext().getPackageManager().canRequestPackageInstalls()) {
                JSObject result = new JSObject();
                result.put("permissionGranted", true);
                call.resolve(result);
                return;
              }
              getActivity().runOnUiThread(() -> {
                try {
                  Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                      Uri.parse("package:" + getContext().getPackageName()));
                  settings.addFlags(Intent.FLAG_ACTIVITY_NO_HISTORY);
                  getActivity().startActivity(settings);
                  JSObject result = new JSObject();
                  result.put("permissionGranted", false);
                  result.put("settingsOpened", true);
                  call.resolve(result);
                } catch (Exception error) {
                  call.reject("PERMISSION_SETTINGS_FAILED: " + error.getClass().getSimpleName() + ": " + error.getMessage(), error);
                }
              });
            }

            @PluginMethod public void installUpdate(PluginCall call) {
              String url = call.getString("url");
              String expected = call.getString("sha256");
              if (url == null || expected == null || !expected.matches("(?i)[0-9a-f]{64}")) {
                call.reject("UPDATE_INPUT_INVALID: Missing APK URL or SHA-256 checksum");
                return;
              }
              Uri source = Uri.parse(url);
              if (!"https".equals(source.getScheme()) ||
                  !"github.com".equalsIgnoreCase(source.getHost()) ||
                  source.getUserInfo() != null ||
                  source.getQuery() != null ||
                  source.getPath() == null ||
                  !(source.getPath().startsWith("/ashdas10/baro-pos-releases/releases/download/") ||
                    source.getPath().startsWith("/ashdas10/baro-pos-releases/releases/latest/download/"))) {
                call.reject("UPDATE_URL_REJECTED: APK URL is not an approved Baro POS release");
                return;
              }
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                  !getContext().getPackageManager().canRequestPackageInstalls()) {
                call.reject("INSTALL_PERMISSION_MISSING: Allow Baro POS to install unknown apps, return here, then tap Download & update again");
                return;
              }

              new Thread(() -> {
                HttpURLConnection connection = null;
                File temporary = new File(getContext().getCacheDir(), "baro-pos-update.apk.part");
                File apk = new File(getContext().getCacheDir(), "baro-pos-update.apk");
                try {
                  temporary.delete();
                  connection = openTrustedConnection(url, "application/vnd.android.package-archive, application/octet-stream", 20000, 45000);
                  int status = connection.getResponseCode();
                  if (status != HttpURLConnection.HTTP_OK) throw new java.io.IOException("APK_DOWNLOAD_HTTP_" + status);
                  Uri finalUri = Uri.parse(connection.getURL().toString());
                  String finalHost = finalUri.getHost();
                  if (!"https".equals(finalUri.getScheme()) || finalHost == null ||
                      !(finalHost.equalsIgnoreCase("github.com") ||
                        finalHost.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                        finalHost.equalsIgnoreCase("objects.githubusercontent.com"))) {
                    throw new java.io.IOException("APK_REDIRECT_REJECTED");
                  }
                  String contentType = connection.getContentType();
                  if (connection.getContentLengthLong() > MAX_APK_BYTES) throw new java.io.IOException("APK_FILE_TOO_LARGE");
                  MessageDigest digest = MessageDigest.getInstance("SHA-256");
                  long total = 0;
                  try (InputStream input = connection.getInputStream();
                       FileOutputStream output = new FileOutputStream(temporary)) {
                    byte[] buffer = new byte[16384];
                    int count;
                    while ((count = input.read(buffer)) != -1) {
                      total += count;
                      if (total > MAX_APK_BYTES) throw new java.io.IOException("APK_FILE_TOO_LARGE");
                      digest.update(buffer, 0, count);
                      output.write(buffer, 0, count);
                    }
                    output.flush();
                    output.getFD().sync();
                  }
                  if (total < 1024 * 1024) throw new java.io.IOException("APK_DOWNLOAD_TOO_SMALL");
                  StringBuilder actual = new StringBuilder();
                  for (byte value : digest.digest()) actual.append(String.format(java.util.Locale.US, "%02x", value));
                  if (!actual.toString().equalsIgnoreCase(expected)) throw new java.io.IOException("APK_CHECKSUM_MISMATCH");
                  if (apk.exists() && !apk.delete()) throw new java.io.IOException("APK_CACHE_CLEANUP_FAILED");
                  if (!temporary.renameTo(apk)) throw new java.io.IOException("APK_CACHE_FINALIZE_FAILED");

                  Uri apkUri = FileProvider.getUriForFile(getContext(),
                      getContext().getPackageName() + ".fileprovider", apk);
                  Intent install = new Intent(Intent.ACTION_INSTALL_PACKAGE);
                  install.setData(apkUri);
                  install.setClipData(android.content.ClipData.newRawUri("Baro POS update", apkUri));
                  install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                  final long downloadedBytes = total;
                  getActivity().runOnUiThread(() -> {
                    try {
                      getActivity().startActivity(install);
                      JSObject result = new JSObject();
                      result.put("installerLaunched", true);
                      result.put("bytesDownloaded", downloadedBytes);
                      call.resolve(result);
                    } catch (Exception error) {
                      call.reject("INSTALL_LAUNCH_FAILED: " + error.getClass().getSimpleName() + ": " + error.getMessage(), error);
                    }
                  });
                } catch (Exception error) {
                  temporary.delete();
                  call.reject("UPDATE_INSTALL_FAILED: " + error.getMessage(), error);
                } finally {
                  if (connection != null) connection.disconnect();
                }
              }).start();
            }
          }
          JAVA
          cat > android/app/src/main/res/xml/baro_file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="updates" path="." /></paths>
          XML
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if "REQUEST_INSTALL_PACKAGES" not in s:
              s=s.replace("<application", '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          provider='''        <provider android:name="androidx.core.content.FileProvider" android:authorities="APP_ID.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/baro_file_paths" /></provider>'''.replace("APP_ID.fileprovider", "$"+"{applicationId}.fileprovider")
          if "androidx.core.content.FileProvider" not in s: s=s.replace("</application>",provider+"\n    </application>",1)
          p.write_text(s)
          main=Path("android/app/src/main/java/com/baro/pos/MainActivity.java")
          if not main.exists():
              main.write_text("package com.baro.pos;\nimport com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\npublic class MainActivity extends BridgeActivity { @Override public void onCreate(Bundle savedInstanceState) { registerPlugin(ApkUpdaterPlugin.class); super.onCreate(savedInstanceState); } }\n")
          else:
              s=main.read_text()
              if "ApkUpdaterPlugin" not in s:
                  if "import com.getcapacitor.BridgeActivity;" in s: s=s.replace("import com.getcapacitor.BridgeActivity;","import com.getcapacitor.BridgeActivity;\nimport com.baro.pos.ApkUpdaterPlugin;")
                  s=re.sub(r"public class MainActivity extends BridgeActivity \{", "public class MainActivity extends BridgeActivity { @Override public void onCreate(android.os.Bundle savedInstanceState) { registerPlugin(ApkUpdaterPlugin.class); super.onCreate(savedInstanceState); }", s, count=1)
                  main.write_text(s)
          PY
      - name: Inject same-device UPI notification listener
        run: python3 scripts/inject-android-upi-notifications.py
      - name: Inject Android section security and native local notifications
        run: python3 scripts/inject-android-section-security-and-notifications.py
      - name: Increase Gradle distribution download timeout
        run: |
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#services.gradle.org#downloads.gradle.org#g' "$WRAPPER"
          if grep -q '^networkTimeout=' "$WRAPPER"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER"
          else
            printf '\nnetworkTimeout=120000\n' >> "$WRAPPER"
          fi
      - name: Assemble unsigned Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify debug APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Create debug APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload unsigned Android debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baro-pos-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

  build-apk:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment:
      name: android-release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private source commit SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be an exact 40-character lowercase commit SHA."
            exit 1
          fi
      - name: Check out private BARO POS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ashdas10/baro-pos
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.BARO_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Run transaction regression tests
        run: npm test
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Build web assets
        run: npm run build
      - name: Create Android platform
        run: npx cap add android
      - name: Generate app icons
        run: |
          mkdir -p assets
          node --input-type=module -e "import sharp from 'sharp'; await sharp('public/cc-icon.svg').resize(1024,1024).png().toFile('assets/icon-only.png'); await sharp({create:{width:2732,height:2732,channels:4,background:'#062E24'}}).composite([{input:await sharp('public/cc-icon.svg').resize(900,900).png().toBuffer(),gravity:'centre'}]).png().toFile('assets/splash.png')"
          npx capacitor-assets generate --android --iconBackgroundColor '#062E24' --splashBackgroundColor '#062E24'
      - name: Sync packaged app
        run: npx cap sync android
      - name: Add native in-app APK updater
        run: |
          mkdir -p android/app/src/main/java/com/baro/pos android/app/src/main/res/xml
          cat > android/app/src/main/java/com/baro/pos/ApkUpdaterPlugin.java <<'JAVA'
          package com.baro.pos;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          @CapacitorPlugin(name = "ApkUpdater")
          public class ApkUpdaterPlugin extends Plugin {
            private static final String MANIFEST = "https://github.com/ashdas10/baro-pos-releases/releases/latest/download/latest.json";
            private static final String APK_PREFIX = "https://github.com/ashdas10/baro-pos-releases/releases/download/";
            private static final String APK_LATEST_PREFIX = "https://github.com/ashdas10/baro-pos-releases/releases/latest/download/";
            private static final int MAX_APK_BYTES = 200 * 1024 * 1024;

            private static boolean isTrustedReleaseHost(Uri uri) {
              String host = uri.getHost();
              return "https".equalsIgnoreCase(uri.getScheme()) && host != null &&
                  (host.equalsIgnoreCase("github.com") ||
                   host.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                   host.equalsIgnoreCase("objects.githubusercontent.com")) &&
                  uri.getUserInfo() == null;
            }

            private HttpURLConnection openTrustedConnection(String address, String accept, int connectTimeout, int readTimeout) throws Exception {
              URL current = new URL(address);
              for (int redirects = 0; redirects <= 5; redirects++) {
                Uri uri = Uri.parse(current.toString());
                if (!isTrustedReleaseHost(uri)) throw new java.io.IOException("UPDATE_REDIRECT_REJECTED");
                HttpURLConnection next = (HttpURLConnection) current.openConnection();
                next.setConnectTimeout(connectTimeout);
                next.setReadTimeout(readTimeout);
                next.setInstanceFollowRedirects(false);
                next.setRequestProperty("Accept", accept);
                int status = next.getResponseCode();
                if (status >= 300 && status < 400) {
                  String location = next.getHeaderField("Location");
                  next.disconnect();
                  if (location == null || location.trim().isEmpty()) throw new java.io.IOException("UPDATE_REDIRECT_MISSING_LOCATION");
                  current = new URL(current, location);
                  continue;
                }
                return next;
              }
              throw new java.io.IOException("UPDATE_REDIRECT_LIMIT");
            }

            @PluginMethod public void checkForUpdate(PluginCall call) {
              new Thread(() -> {
                HttpURLConnection connection = null;
                try {
                  connection = openTrustedConnection(MANIFEST, "application/json", 15000, 15000);
                  int status = connection.getResponseCode();
                  if (status != HttpURLConnection.HTTP_OK) {
                    throw new java.io.IOException("UPDATE_CHECK_HTTP_" + status);
                  }
                  Uri finalUri = Uri.parse(connection.getURL().toString());
                  String finalHost = finalUri.getHost();
                  if (!"https".equals(finalUri.getScheme()) || finalHost == null ||
                      !(finalHost.equalsIgnoreCase("github.com") ||
                        finalHost.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                        finalHost.equalsIgnoreCase("objects.githubusercontent.com"))) {
                    throw new java.io.IOException("UPDATE_REDIRECT_REJECTED");
                  }
                  try (InputStream input = connection.getInputStream();
                       java.io.ByteArrayOutputStream output = new java.io.ByteArrayOutputStream()) {
                    byte[] buffer = new byte[4096];
                    int count;
                    while ((count = input.read(buffer)) != -1) {
                      if (output.size() + count > 1024 * 1024) throw new java.io.IOException("UPDATE_MANIFEST_TOO_LARGE");
                      output.write(buffer, 0, count);
                    }
                    JSONObject manifest = new JSONObject(output.toString("UTF-8"));
                    String version = manifest.optString("version", "");
                    String url = manifest.optString("apkUrl", "");
                    String checksum = manifest.optString("sha256", "");
                    if (version.isEmpty() || (!url.startsWith(APK_PREFIX) && !url.startsWith(APK_LATEST_PREFIX)) || !checksum.matches("(?i)[0-9a-f]{64}")) {
                      throw new java.io.IOException("UPDATE_MANIFEST_INVALID");
                    }
                    JSObject result = new JSObject();
                    result.put("update", manifest);
                    call.resolve(result);
                  }
                } catch (Exception error) {
                  call.reject("UPDATE_CHECK_FAILED: " + error.getMessage(), error);
                } finally {
                  if (connection != null) connection.disconnect();
                }
              }).start();
            }

            @PluginMethod public void openInstallPermissionSettings(PluginCall call) {
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O ||
                  getContext().getPackageManager().canRequestPackageInstalls()) {
                JSObject result = new JSObject();
                result.put("permissionGranted", true);
                call.resolve(result);
                return;
              }
              getActivity().runOnUiThread(() -> {
                try {
                  Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                      Uri.parse("package:" + getContext().getPackageName()));
                  settings.addFlags(Intent.FLAG_ACTIVITY_NO_HISTORY);
                  getActivity().startActivity(settings);
                  JSObject result = new JSObject();
                  result.put("permissionGranted", false);
                  result.put("settingsOpened", true);
                  call.resolve(result);
                } catch (Exception error) {
                  call.reject("PERMISSION_SETTINGS_FAILED: " + error.getClass().getSimpleName() + ": " + error.getMessage(), error);
                }
              });
            }

            @PluginMethod public void installUpdate(PluginCall call) {
              String url = call.getString("url");
              String expected = call.getString("sha256");
              if (url == null || expected == null || !expected.matches("(?i)[0-9a-f]{64}")) {
                call.reject("UPDATE_INPUT_INVALID: Missing APK URL or SHA-256 checksum");
                return;
              }
              Uri source = Uri.parse(url);
              if (!"https".equals(source.getScheme()) ||
                  !"github.com".equalsIgnoreCase(source.getHost()) ||
                  source.getUserInfo() != null ||
                  source.getQuery() != null ||
                  source.getPath() == null ||
                  !(source.getPath().startsWith("/ashdas10/baro-pos-releases/releases/download/") ||
                    source.getPath().startsWith("/ashdas10/baro-pos-releases/releases/latest/download/"))) {
                call.reject("UPDATE_URL_REJECTED: APK URL is not an approved Baro POS release");
                return;
              }
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                  !getContext().getPackageManager().canRequestPackageInstalls()) {
                call.reject("INSTALL_PERMISSION_MISSING: Allow Baro POS to install unknown apps, return here, then tap Download & update again");
                return;
              }

              new Thread(() -> {
                HttpURLConnection connection = null;
                File temporary = new File(getContext().getCacheDir(), "baro-pos-update.apk.part");
                File apk = new File(getContext().getCacheDir(), "baro-pos-update.apk");
                try {
                  temporary.delete();
                  connection = openTrustedConnection(url, "application/vnd.android.package-archive, application/octet-stream", 20000, 45000);
                  int status = connection.getResponseCode();
                  if (status != HttpURLConnection.HTTP_OK) throw new java.io.IOException("APK_DOWNLOAD_HTTP_" + status);
                  Uri finalUri = Uri.parse(connection.getURL().toString());
                  String finalHost = finalUri.getHost();
                  if (!"https".equals(finalUri.getScheme()) || finalHost == null ||
                      !(finalHost.equalsIgnoreCase("github.com") ||
                        finalHost.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                        finalHost.equalsIgnoreCase("objects.githubusercontent.com"))) {
                    throw new java.io.IOException("APK_REDIRECT_REJECTED");
                  }
                  String contentType = connection.getContentType();
                  if (connection.getContentLengthLong() > MAX_APK_BYTES) throw new java.io.IOException("APK_FILE_TOO_LARGE");
                  MessageDigest digest = MessageDigest.getInstance("SHA-256");
                  long total = 0;
                  try (InputStream input = connection.getInputStream();
                       FileOutputStream output = new FileOutputStream(temporary)) {
                    byte[] buffer = new byte[16384];
                    int count;
                    while ((count = input.read(buffer)) != -1) {
                      total += count;
                      if (total > MAX_APK_BYTES) throw new java.io.IOException("APK_FILE_TOO_LARGE");
                      digest.update(buffer, 0, count);
                      output.write(buffer, 0, count);
                    }
                    output.flush();
                    output.getFD().sync();
                  }
                  if (total < 1024 * 1024) throw new java.io.IOException("APK_DOWNLOAD_TOO_SMALL");
                  StringBuilder actual = new StringBuilder();
                  for (byte value : digest.digest()) actual.append(String.format(java.util.Locale.US, "%02x", value));
                  if (!actual.toString().equalsIgnoreCase(expected)) throw new java.io.IOException("APK_CHECKSUM_MISMATCH");
                  if (apk.exists() && !apk.delete()) throw new java.io.IOException("APK_CACHE_CLEANUP_FAILED");
                  if (!temporary.renameTo(apk)) throw new java.io.IOException("APK_CACHE_FINALIZE_FAILED");

                  Uri apkUri = FileProvider.getUriForFile(getContext(),
                      getContext().getPackageName() + ".fileprovider", apk);
                  Intent install = new Intent(Intent.ACTION_INSTALL_PACKAGE);
                  install.setData(apkUri);
                  install.setClipData(android.content.ClipData.newRawUri("Baro POS update", apkUri));
                  install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                  final long downloadedBytes = total;
                  getActivity().runOnUiThread(() -> {
                    try {
                      getActivity().startActivity(install);
                      JSObject result = new JSObject();
                      result.put("installerLaunched", true);
                      result.put("bytesDownloaded", downloadedBytes);
                      call.resolve(result);
                    } catch (Exception error) {
                      call.reject("INSTALL_LAUNCH_FAILED: " + error.getClass().getSimpleName() + ": " + error.getMessage(), error);
                    }
                  });
                } catch (Exception error) {
                  temporary.delete();
                  call.reject("UPDATE_INSTALL_FAILED: " + error.getMessage(), error);
                } finally {
                  if (connection != null) connection.disconnect();
                }
              }).start();
            }
          }
          JAVA
          cat > android/app/src/main/res/xml/baro_file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="updates" path="." /></paths>
