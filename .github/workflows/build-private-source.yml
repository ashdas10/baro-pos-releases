            Baro-POS-*.baseline.manifest-tree.txt
            Baro-POS-*-to-*.manifest-tree-diff.txt
            Baro-POS-*.packaged-files.txt
            Baro-POS-*.audit-sha256.txt
            Baro-POS-*.baseline.permissions.txt
            Baro-POS-*.baseline.badging.txt
            Baro-POS-*.baseline.signer.txt
            Baro-POS-*.baseline.sha256
            Baro-POS-*-to-*.permissions-diff.txt
            Baro-POS-*-to-*.badging-diff.txt
            Baro-POS-*-to-*.packaged-files-diff.txt
            Baro-POS-*.native-payload-sha256.txt
            Baro-POS-*.baseline-native-payload-sha256.txt
            Baro-POS-*-to-*.native-payload-diff.txt
          if-no-files-found: error
          retention-days: 14
      - name: Generate update manifest
        run: |
          SHA256="$(sha256sum "Baro-POS-$BARO_VERSION.apk" | cut -d ' ' -f 1)"
          case "$BARO_VERSION" in
            1.4.6) RELEASE_NOTES="See operating mode and store status together at checkout. Review more ticket lines with compact quantity, order and discount controls. Find settings by category, with separate backup, security and app information pages. Updated menu and report controls follow the selected theme. Open the BARO website from the sidebar or About BARO." ;;
            1.4.5) RELEASE_NOTES="Refined official BARO branding and footer lockup; theme-aware Appearance controls and Android adaptive/monochrome launcher icon; improved landscape checkout on phones and tablets with a larger independently scrolling item list; corrected Android system-bar insets; masked section PIN confirmation dialogs; disabled Android system backup for device-bound security credentials while retaining encrypted in-app backup." ;;
            1.4.4) RELEASE_NOTES="Official BARO brand identity across the app; updated launcher icon and splash branding; dedicated Appearance settings with theme and accent presets; consistent BARO navigation styling; official 58mm and 80mm thermal receipt footer artwork. Merchant identity, POS checkout layout, billing, inventory, finance and backup workflows preserved." ;;
            1.4.3.1) RELEASE_NOTES="Android phone portrait system-bar spacing and short-landscape POS checkout layout corrections; distinct patch build identity for device verification." ;;
            1.4.3) RELEASE_NOTES="Responsive POS and app-wide phone/tablet UX improvements; clearer checkout, add-on stock guidance, accessible cart controls, held-ticket and kitchen workflows; improved Menu, Inventory, Sales and Reports controls; removed automatic UPI notification reading and the Reports UPI activity inbox to reduce sensitive Android access; UPI QR generation and manual cashier payment verification remain supported; existing payment records and backup compatibility preserved." ;;
            1.4.2) RELEASE_NOTES="Improved responsive layouts across phones and tablets; POS-only operational navigation with a brand shortcut back to Point of Sale; clearer encrypted backup passphrase and recovery-code guidance; one shared section PIN with independent protection switches; compact Data & app info settings; readable bullet-list update notes." ;;
            1.4.1) RELEASE_NOTES="Independent Store Open/Closed controls; optional Android Keystore section locks with PIN and biometric fallback; opt-in Finance Vault recovery; encrypted full POS portable backups; CSV, XLSX and PDF exports; light, dark and device themes; redesigned Finance reports; configurable store-aware Android notifications." ;;
            1.4.0) RELEASE_NOTES="QR-session-scoped same-device UPI evidence with fresh exact-amount matching and cashier-confirmed settlement; dedicated Reports UPI activity review; encrypted Android notification evidence; protected Finance Workspace records and ledger safeguards; reproducible npm installs and dependency security fixes." ;;
            1.3.13) RELEASE_NOTES="Combined fixed and percentage POS discounts with clear bill breakdown, Bills date filtering, and custom report date ranges. Includes the 1.3.12 Settings and same-device UPI improvements." ;;
            1.3.12) RELEASE_NOTES="Compact, reordered Settings with clear selected states, cleaner GST controls, and same-device UPI notification access fix. Includes the 1.3.11 billing, receipts, FSSAI, KOT and backup improvements." ;;
            1.3.11) RELEASE_NOTES="GST-ready billing and invoice settings, FSSAI business identity, improved customer receipts, same-device UPI payment evidence, kitchen KOT workflow, settings improvements, and backup and migration updates. Two-device UPI Connect remains a future update." ;;
            1.3.9) RELEASE_NOTES="Finance transaction drilldowns and editing, event sales-versus-cost summaries, provisional recorded result, and POS overlap warnings for CSV imports." ;;
            1.3.8) RELEASE_NOTES="Sales detail popups, clearer finance history, safe legacy classification, scoped finance clearing, and faster navigation to POS." ;;
            1.3.7) RELEASE_NOTES="Simpler finance CSV imports with clear expense and imported-sales classification, combined sales overview, and safe re-imports." ;;
            1.3.6) RELEASE_NOTES="Business finance safeguards: ambiguous sales and income stay out of expense totals until classified; full searchable and filterable finance history." ;;
            1.3.5) RELEASE_NOTES="CSV import fix: preserves rows needing review when categories are not transaction types; handles standard and escaped line endings." ;;
            1.3.3) RELEASE_NOTES="Finance import/export improvements: highlighted file upload, export dropdown with CSV, JSON, Excel-compatible spreadsheet, and PDF print options; copyable AI finance import prompt." ;;
            1.3.2) RELEASE_NOTES="Disabled pinch-to-zoom for a steadier phone and tablet POS layout." ;;
            1.3.1) RELEASE_NOTES="Finance workspace dark-theme polish, improved contrast, mobile-friendly tabs, and detailed update notes." ;;
            1.3.0) RELEASE_NOTES="Business Finance workspace with investments and funding, expenses and purchases, cash flow and accounts, events and stalls, financial reports, and reviewed CSV/TSV imports with duplicate checks." ;;
            1.2.22) RELEASE_NOTES="Compact consumable management; clearer reports; improved held-ticket workflow and official update popup." ;;
            1.2.21) RELEASE_NOTES="Consumable inventory, linked supply deductions on completed sales, stock movements, wastage and adjustments, and consumables backup/restore." ;;
            1.2.20) RELEASE_NOTES="Day-by-day sales reporting with zero-sales dates; drafts and voided bills excluded from reporting." ;;
            *) RELEASE_NOTES="Bug fixes, usability improvements, and reliability updates." ;;
          esac
          # Use the same Markdown notes for the in-app update and GitHub release.
          NOTES_FILE="docs/releases/$BARO_VERSION.md"
          if [[ -f "$NOTES_FILE" ]]; then
            RELEASE_NOTES="$(cat "$NOTES_FILE")"
          fi
          export SHA256 RELEASE_NOTES
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["BARO_VERSION"]
          manifest = {
              "version": version,
              "versionCode": int(os.environ["BARO_VERSION_CODE"]),
              "packageName": "com.baro.pos",
              "apkUrl": f"https://github.com/ashdas10/baro-pos-releases/releases/download/v{version}/Baro-POS.apk",
              "sha256": os.environ["SHA256"],
              "releaseNotes": os.environ["RELEASE_NOTES"],
          }
          Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Validate update manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["BARO_VERSION"]
          version_code = int(os.environ["BARO_VERSION_CODE"])
          apk = Path(f"Baro-POS-{version}.apk")
          manifest_path = Path("latest.json")
          if not apk.is_file() or apk.stat().st_size < 1024 * 1024:
              raise SystemExit("Signed APK is missing or unexpectedly small.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          generic = Path("Baro-POS.apk")
          if hashlib.sha256(generic.read_bytes()).hexdigest() != digest:
              raise SystemExit("Website APK differs from the verified version-specific APK.")
          checksum = Path(f"{apk.name}.sha256").read_text(encoding="utf-8").split()
          if checksum != [digest, apk.name]:
              raise SystemExit("Published checksum file does not match the signed APK.")
          identity = Path(f"Baro-POS-{version}.badging.txt").read_text(encoding="utf-8").splitlines()[0]
          for field, value in (("name", "com.baro.pos"), ("versionCode", str(version_code)), ("versionName", version)):
              if f" {field}='{value}'" not in identity:
                  raise SystemExit(f"Signed Android package has unexpected {field}.")
          expected = {
              "version": version,
              "versionCode": version_code,
              "packageName": "com.baro.pos",
              "apkUrl": f"https://github.com/ashdas10/baro-pos-releases/releases/download/v{version}/Baro-POS.apk",
              "sha256": digest,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Update manifest mismatch for {key}.")
          if not isinstance(manifest.get("releaseNotes"), str) or not manifest["releaseNotes"].strip():
              raise SystemExit("Update manifest release notes are missing.")
          print(f"Validated latest.json for Baro POS {version}; APK SHA-256 {digest}.")
          PY
      - name: Upload validated update manifest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baro-pos-update-manifest-${{ github.sha }}
          path: latest.json
          if-no-files-found: error
          retention-days: 14
      - name: Create draft GitHub release for final review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ashdas10/baro-pos-releases
        run: |
          TAG="v$BARO_VERSION"
          NOTES_FILE="$(mktemp)"
          python - <<'PY' > "$NOTES_FILE"
          import json
          from pathlib import Path
          manifest = json.loads(Path("latest.json").read_text(encoding="utf-8"))
          print(manifest["releaseNotes"])
          print()
          print("This is a draft release pending final device installation and update-path verification.")
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "A published release already exists for $TAG; refusing to overwrite it."
              exit 1
            fi
            gh release upload "$TAG" "Baro-POS-$BARO_VERSION.apk" Baro-POS.apk latest.json "Baro-POS-$BARO_VERSION.apk.sha256" --clobber
            gh release edit "$TAG" --title "BARO POS $BARO_VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "Baro-POS-$BARO_VERSION.apk" Baro-POS.apk latest.json "Baro-POS-$BARO_VERSION.apk.sha256" \
              --draft --title "BARO POS $BARO_VERSION" --notes-file "$NOTES_FILE"
          fi
          rm -f "$NOTES_FILE"
