          const res = 'android/app/src/main/res';
          const dirs = (await readdir(res, {withFileTypes:true})).filter(d => d.isDirectory() && /^mipmap-(mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi)$/.test(d.name)).map(d => d.name);
          const sizes = {mdpi:48,hdpi:72,xhdpi:96,xxhdpi:144,xxxhdpi:192};
          for (const dir of dirs) {
            const density = dir.replace('mipmap-','');
