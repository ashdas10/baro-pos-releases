name: Build Baro POS Android Release APK
# Manual signed-APK release pipeline for the private BARO POS source repository.

on:
  push:
    branches: [chore/1.4.7-release-notes]
    paths: [.github/workflows/build-private-source.yml]
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Run regression tests and compile Android without signing or releasing"
        type: boolean
        default: false
      source_sha:
        description: "Exact 40-character commit SHA from the private BARO POS repository"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: baro-pos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPMENT_SOURCE_SHA: 5f61c714bf54d29a70bbb6aad7c1dfb65eb02093

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate private source commit SHA
        env:
          SOURCE_SHA: ${{ github.event_name == 'push' && env.DEVELOPMENT_SOURCE_SHA || inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be an exact 40-character lowercase commit SHA."
            exit 1
          fi
      - name: Check out private BARO POS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ashdas10/baro-pos
          ref: ${{ github.event_name == 'push' && env.DEVELOPMENT_SOURCE_SHA || inputs.source_sha }}
          token: ${{ secrets.BARO_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify and extract official BARO web assets
        run: python3 scripts/apply-brand-pack.py --web
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm ci
      - name: Validate BARO Brand Pack integration script
        run: python3 -m py_compile scripts/apply-brand-pack.py
      - name: Validate Android section-security and notification injection script
        run: python3 -m py_compile scripts/inject-android-section-security-and-notifications.py
      - name: Audit npm dependencies
        run: node scripts/audit-dependencies.mjs
      - name: Run transaction regression tests
        run: npm test
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Build web assets
        run: npm run build

      - name: Verify development checkout layout and contrast in Chrome
        if: ${{ github.event_name == 'push' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/baro-browser" --ignore-scripts --no-save --no-audit --no-fund playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/baro-browser/node_modules" node scripts/check-pos-layout.cjs

  android-validation:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Validate private source commit SHA
        env:
          SOURCE_SHA: ${{ github.event_name == 'push' && env.DEVELOPMENT_SOURCE_SHA || inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be an exact 40-character lowercase commit SHA."
            exit 1
          fi
      - name: Check out private BARO POS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ashdas10/baro-pos
          ref: ${{ github.event_name == 'push' && env.DEVELOPMENT_SOURCE_SHA || inputs.source_sha }}
          token: ${{ secrets.BARO_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify and extract official BARO web assets
        run: python3 scripts/apply-brand-pack.py --web
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run transaction regression tests
        run: npm test
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Build web assets
        run: npm run build
      - name: Create Android platform
        run: npx cap add android
      - name: Generate app icons
        run: |
          mkdir -p assets
          python3 scripts/apply-brand-pack.py --prepare-android
          node --input-type=module -e "import sharp from 'sharp'; await sharp('public/brand/baro-mark-light.svg').resize(1024,1024).png().toFile('assets/icon-only.png')"
          npx capacitor-assets generate --android --iconBackgroundColor '#FF5B2E' --splashBackgroundColor '#14110F'
      - name: Sync Capacitor Android 8
        run: npx cap sync android
      - name: Apply exact official BARO Android resources
        run: python3 scripts/apply-brand-pack.py --android
      - name: Add native in-app APK updater
        run: |
          mkdir -p android/app/src/main/java/com/baro/pos android/app/src/main/res/xml
          cat > android/app/src/main/java/com/baro/pos/ApkUpdaterPlugin.java <<'JAVA'
          package com.baro.pos;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          @CapacitorPlugin(name = "ApkUpdater")
          public class ApkUpdaterPlugin extends Plugin {
            private static final String MANIFEST = "https://github.com/ashdas10/baro-pos-releases/releases/latest/download/latest.json";
            private static final String APK_PREFIX = "https://github.com/ashdas10/baro-pos-releases/releases/download/";
            private static final String APK_LATEST_PREFIX = "https://github.com/ashdas10/baro-pos-releases/releases/latest/download/";
            private static final int MAX_APK_BYTES = 200 * 1024 * 1024;

            private static boolean isTrustedReleaseHost(Uri uri) {
              String host = uri.getHost();
              return "https".equalsIgnoreCase(uri.getScheme()) && host != null &&
                  (host.equalsIgnoreCase("github.com") ||
                   host.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                   host.equalsIgnoreCase("objects.githubusercontent.com")) &&
                  uri.getUserInfo() == null;
            }

            private HttpURLConnection openTrustedConnection(String address, String accept, int connectTimeout, int readTimeout) throws Exception {
              URL current = new URL(address);
              for (int redirects = 0; redirects <= 5; redirects++) {
                Uri uri = Uri.parse(current.toString());
                if (!isTrustedReleaseHost(uri)) throw new java.io.IOException("UPDATE_REDIRECT_REJECTED");
                HttpURLConnection next = null;
                int status = -1;
                java.io.IOException lastConnectionError = null;
                // Retry only transient connection/response-read failures. Redirect-policy
                // failures, HTTP errors, stream failures and checksum failures are not retried.
                for (int attempt = 0; attempt < 3; attempt++) {
                  try {
                    next = (HttpURLConnection) current.openConnection();
                    next.setConnectTimeout(connectTimeout);
                    next.setReadTimeout(readTimeout);
                    next.setInstanceFollowRedirects(false);
                    next.setRequestProperty("Accept", accept);
                    status = next.getResponseCode();
                    lastConnectionError = null;
                    break;
                  } catch (java.io.IOException error) {
                    // TLS trust/handshake and protocol failures are not transient network drops.
                    if (error instanceof javax.net.ssl.SSLException || error instanceof java.net.ProtocolException) throw error;
                    lastConnectionError = error;
                    if (next != null) next.disconnect();
                    next = null;
                    if (attempt < 2) {
                      try {
                        Thread.sleep(500L * (attempt + 1));
                      } catch (InterruptedException interrupted) {
                        Thread.currentThread().interrupt();
                        throw new java.io.IOException("UPDATE_RETRY_INTERRUPTED", interrupted);
                      }
                    }
                  }
                }
                if (lastConnectionError != null) throw lastConnectionError;
                if (next == null) throw new java.io.IOException("UPDATE_CONNECTION_FAILED");
                if (status >= 300 && status < 400) {
                  String location = next.getHeaderField("Location");
                  next.disconnect();
                  if (location == null || location.trim().isEmpty()) throw new java.io.IOException("UPDATE_REDIRECT_MISSING_LOCATION");
                  current = new URL(current, location);
                  continue;
                }
                return next;
              }
              throw new java.io.IOException("UPDATE_REDIRECT_LIMIT");
            }

            @PluginMethod public void checkForUpdate(PluginCall call) {
              new Thread(() -> {
                HttpURLConnection connection = null;
                try {
                  connection = openTrustedConnection(MANIFEST, "application/json", 15000, 15000);
                  int status = connection.getResponseCode();
                  if (status != HttpURLConnection.HTTP_OK) {
                    throw new java.io.IOException("UPDATE_CHECK_HTTP_" + status);
                  }
                  Uri finalUri = Uri.parse(connection.getURL().toString());
                  String finalHost = finalUri.getHost();
                  if (!"https".equals(finalUri.getScheme()) || finalHost == null ||
                      !(finalHost.equalsIgnoreCase("github.com") ||
                        finalHost.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                        finalHost.equalsIgnoreCase("objects.githubusercontent.com"))) {
                    throw new java.io.IOException("UPDATE_REDIRECT_REJECTED");
                  }
                  try (InputStream input = connection.getInputStream();
                       java.io.ByteArrayOutputStream output = new java.io.ByteArrayOutputStream()) {
                    byte[] buffer = new byte[4096];
                    int count;
                    while ((count = input.read(buffer)) != -1) {
                      if (output.size() + count > 1024 * 1024) throw new java.io.IOException("UPDATE_MANIFEST_TOO_LARGE");
                      output.write(buffer, 0, count);
                    }
                    JSONObject manifest = new JSONObject(output.toString("UTF-8"));
                    String version = manifest.optString("version", "");
                    String url = manifest.optString("apkUrl", "");
                    String checksum = manifest.optString("sha256", "");
                    if (version.isEmpty() || (!url.startsWith(APK_PREFIX) && !url.startsWith(APK_LATEST_PREFIX)) || !checksum.matches("(?i)[0-9a-f]{64}")) {
                      throw new java.io.IOException("UPDATE_MANIFEST_INVALID");
                    }
                    JSObject result = new JSObject();
                    result.put("update", manifest);
                    call.resolve(result);
                  }
                } catch (Exception error) {
                  call.reject("UPDATE_CHECK_FAILED: " + error.getMessage(), error);
                } finally {
                  if (connection != null) connection.disconnect();
                }
              }).start();
            }

            @PluginMethod public void openInstallPermissionSettings(PluginCall call) {
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O ||
                  getContext().getPackageManager().canRequestPackageInstalls()) {
                JSObject result = new JSObject();
                result.put("permissionGranted", true);
                call.resolve(result);
                return;
              }
              getActivity().runOnUiThread(() -> {
                try {
                  Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                      Uri.parse("package:" + getContext().getPackageName()));
                  settings.addFlags(Intent.FLAG_ACTIVITY_NO_HISTORY);
                  getActivity().startActivity(settings);
                  JSObject result = new JSObject();
                  result.put("permissionGranted", false);
                  result.put("settingsOpened", true);
                  call.resolve(result);
                } catch (Exception error) {
                  call.reject("PERMISSION_SETTINGS_FAILED: " + error.getClass().getSimpleName() + ": " + error.getMessage(), error);
                }
              });
            }

            @PluginMethod public void installUpdate(PluginCall call) {
              String url = call.getString("url");
              String expected = call.getString("sha256");
              if (url == null || expected == null || !expected.matches("(?i)[0-9a-f]{64}")) {
                call.reject("UPDATE_INPUT_INVALID: Missing APK URL or SHA-256 checksum");
                return;
              }
              Uri source = Uri.parse(url);
              if (!"https".equals(source.getScheme()) ||
                  !"github.com".equalsIgnoreCase(source.getHost()) ||
                  source.getUserInfo() != null ||
                  source.getQuery() != null ||
                  source.getPath() == null ||
                  !(source.getPath().startsWith("/ashdas10/baro-pos-releases/releases/download/") ||
                    source.getPath().startsWith("/ashdas10/baro-pos-releases/releases/latest/download/"))) {
                call.reject("UPDATE_URL_REJECTED: APK URL is not an approved Baro POS release");
                return;
              }
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                  !getContext().getPackageManager().canRequestPackageInstalls()) {
                call.reject("INSTALL_PERMISSION_MISSING: Allow Baro POS to install unknown apps, return here, then tap Download & update again");
                return;
              }

              new Thread(() -> {
                HttpURLConnection connection = null;
                File temporary = new File(getContext().getCacheDir(), "baro-pos-update.apk.part");
                File apk = new File(getContext().getCacheDir(), "baro-pos-update.apk");
                String stage = "START";
                try {
                  temporary.delete();
                  stage = "CONNECT_AND_VALIDATE_REDIRECTS";
                  connection = openTrustedConnection(url, "application/vnd.android.package-archive, application/octet-stream", 20000, 45000);
                  stage = "CHECK_HTTP_RESPONSE";
                  int status = connection.getResponseCode();
                  if (status != HttpURLConnection.HTTP_OK) throw new java.io.IOException("APK_DOWNLOAD_HTTP_" + status);
                  Uri finalUri = Uri.parse(connection.getURL().toString());
                  String finalHost = finalUri.getHost();
                  if (!"https".equals(finalUri.getScheme()) || finalHost == null ||
                      !(finalHost.equalsIgnoreCase("github.com") ||
                        finalHost.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                        finalHost.equalsIgnoreCase("objects.githubusercontent.com"))) {
                    throw new java.io.IOException("APK_REDIRECT_REJECTED");
                  }
                  String contentType = connection.getContentType();
                  if (connection.getContentLengthLong() > MAX_APK_BYTES) throw new java.io.IOException("APK_FILE_TOO_LARGE");
                  stage = "STREAM_APK_TO_TEMP_FILE";
                  MessageDigest digest = MessageDigest.getInstance("SHA-256");
                  long total = 0;
                  try (InputStream input = connection.getInputStream();
                       FileOutputStream output = new FileOutputStream(temporary)) {
                    byte[] buffer = new byte[16384];
                    int count;
                    while ((count = input.read(buffer)) != -1) {
                      total += count;
                      if (total > MAX_APK_BYTES) throw new java.io.IOException("APK_FILE_TOO_LARGE");
                      digest.update(buffer, 0, count);
                      output.write(buffer, 0, count);
                    }
                    output.flush();
                    output.getFD().sync();
                  }
                  stage = "VERIFY_SIZE_AND_SHA256";
                  if (total < 1024 * 1024) throw new java.io.IOException("APK_DOWNLOAD_TOO_SMALL");
                  StringBuilder actual = new StringBuilder();
                  for (byte value : digest.digest()) actual.append(String.format(java.util.Locale.US, "%02x", value));
                  if (!actual.toString().equalsIgnoreCase(expected)) throw new java.io.IOException("APK_CHECKSUM_MISMATCH");
                  stage = "FINALIZE_VERIFIED_APK_CACHE";
                  if (apk.exists() && !apk.delete()) throw new java.io.IOException("APK_CACHE_CLEANUP_FAILED");
                  if (!temporary.renameTo(apk)) throw new java.io.IOException("APK_CACHE_FINALIZE_FAILED");

                  stage = "OPEN_ANDROID_INSTALLER";
                  Uri apkUri = FileProvider.getUriForFile(getContext(),
                      getContext().getPackageName() + ".fileprovider", apk);
                  Intent install = new Intent(Intent.ACTION_INSTALL_PACKAGE);
                  install.setData(apkUri);
                  install.setClipData(android.content.ClipData.newRawUri("Baro POS update", apkUri));
                  install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                  final long downloadedBytes = total;
                  getActivity().runOnUiThread(() -> {
                    try {
                      getActivity().startActivity(install);
                      JSObject result = new JSObject();
                      result.put("installerLaunched", true);
                      result.put("bytesDownloaded", downloadedBytes);
                      call.resolve(result);
                    } catch (Exception error) {
                      call.reject("INSTALL_LAUNCH_FAILED: " + error.getClass().getSimpleName() + ": " + error.getMessage(), error);
                    }
                  });
                } catch (Exception error) {
                  temporary.delete();
                  call.reject("UPDATE_INSTALL_FAILED [" + stage + "]: " + error.getMessage(), error);
                } finally {
                  if (connection != null) connection.disconnect();
                }
              }).start();
            }
          }
          JAVA
          cat > android/app/src/main/res/xml/baro_file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="updates" path="." /></paths>
          XML
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if "REQUEST_INSTALL_PACKAGES" not in s:
              s=s.replace("<application", '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          provider='''        <provider android:name="androidx.core.content.FileProvider" android:authorities="APP_ID.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/baro_file_paths" /></provider>'''.replace("APP_ID.fileprovider", "$"+"{applicationId}.fileprovider")
          if "androidx.core.content.FileProvider" not in s: s=s.replace("</application>",provider+"\n    </application>",1)
          p.write_text(s)
          main=Path("android/app/src/main/java/com/baro/pos/MainActivity.java")
          if not main.exists():
              main.write_text("package com.baro.pos;\nimport com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\npublic class MainActivity extends BridgeActivity { @Override public void onCreate(Bundle savedInstanceState) { registerPlugin(ApkUpdaterPlugin.class); super.onCreate(savedInstanceState); } }\n")
          else:
              s=main.read_text()
              if "ApkUpdaterPlugin" not in s:
                  if "import com.getcapacitor.BridgeActivity;" in s: s=s.replace("import com.getcapacitor.BridgeActivity;","import com.getcapacitor.BridgeActivity;\nimport com.baro.pos.ApkUpdaterPlugin;")
                  s=re.sub(r"public class MainActivity extends BridgeActivity \{", "public class MainActivity extends BridgeActivity { @Override public void onCreate(android.os.Bundle savedInstanceState) { registerPlugin(ApkUpdaterPlugin.class); super.onCreate(savedInstanceState); }", s, count=1)
                  main.write_text(s)
          PY
      - name: Inject Android section security and native local notifications
        run: python3 scripts/inject-android-section-security-and-notifications.py
      - name: Increase Gradle distribution download timeout
        run: |
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#services.gradle.org#downloads.gradle.org#g' "$WRAPPER"
          if grep -q '^networkTimeout=' "$WRAPPER"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER"
          else
            printf '\nnetworkTimeout=120000\n' >> "$WRAPPER"
          fi
      - name: Assemble unsigned Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify debug APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Create debug APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload unsigned Android debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.validation_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baro-pos-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

  build-apk:
    needs: [validate, android-validation]
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.validation_only }}
    environment:
      name: android-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private source commit SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be an exact 40-character lowercase commit SHA."
            exit 1
          fi
      - name: Check out private BARO POS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ashdas10/baro-pos
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.BARO_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify and extract official BARO web assets
        run: python3 scripts/apply-brand-pack.py --web
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: node scripts/audit-dependencies.mjs
      - name: Run transaction regression tests
        run: npm test
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Build web assets
        run: npm run build
      - name: Create Android platform
        run: npx cap add android
      - name: Generate app icons
        run: |
          mkdir -p assets
          python3 scripts/apply-brand-pack.py --prepare-android
          node --input-type=module -e "import sharp from 'sharp'; await sharp('public/brand/baro-mark-light.svg').resize(1024,1024).png().toFile('assets/icon-only.png')"
          npx capacitor-assets generate --android --iconBackgroundColor '#FF5B2E' --splashBackgroundColor '#14110F'
      - name: Sync packaged app
        run: npx cap sync android
      - name: Apply exact official BARO Android resources
        run: python3 scripts/apply-brand-pack.py --android
      - name: Add native in-app APK updater
        run: |
          mkdir -p android/app/src/main/java/com/baro/pos android/app/src/main/res/xml
          cat > android/app/src/main/java/com/baro/pos/ApkUpdaterPlugin.java <<'JAVA'
          package com.baro.pos;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          @CapacitorPlugin(name = "ApkUpdater")
          public class ApkUpdaterPlugin extends Plugin {
            private static final String MANIFEST = "https://github.com/ashdas10/baro-pos-releases/releases/latest/download/latest.json";
            private static final String APK_PREFIX = "https://github.com/ashdas10/baro-pos-releases/releases/download/";
            private static final String APK_LATEST_PREFIX = "https://github.com/ashdas10/baro-pos-releases/releases/latest/download/";
            private static final int MAX_APK_BYTES = 200 * 1024 * 1024;

            private static boolean isTrustedReleaseHost(Uri uri) {
              String host = uri.getHost();
              return "https".equalsIgnoreCase(uri.getScheme()) && host != null &&
                  (host.equalsIgnoreCase("github.com") ||
                   host.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                   host.equalsIgnoreCase("objects.githubusercontent.com")) &&
                  uri.getUserInfo() == null;
            }

            private HttpURLConnection openTrustedConnection(String address, String accept, int connectTimeout, int readTimeout) throws Exception {
              URL current = new URL(address);
              for (int redirects = 0; redirects <= 5; redirects++) {
                Uri uri = Uri.parse(current.toString());
                if (!isTrustedReleaseHost(uri)) throw new java.io.IOException("UPDATE_REDIRECT_REJECTED");
                HttpURLConnection next = null;
                int status = -1;
                java.io.IOException lastConnectionError = null;
                // Retry only transient connection/response-read failures. Redirect-policy
                // failures, HTTP errors, stream failures and checksum failures are not retried.
                for (int attempt = 0; attempt < 3; attempt++) {
                  try {
                    next = (HttpURLConnection) current.openConnection();
                    next.setConnectTimeout(connectTimeout);
                    next.setReadTimeout(readTimeout);
                    next.setInstanceFollowRedirects(false);
                    next.setRequestProperty("Accept", accept);
                    status = next.getResponseCode();
                    lastConnectionError = null;
                    break;
                  } catch (java.io.IOException error) {
                    // TLS trust/handshake and protocol failures are not transient network drops.
                    if (error instanceof javax.net.ssl.SSLException || error instanceof java.net.ProtocolException) throw error;
                    lastConnectionError = error;
                    if (next != null) next.disconnect();
                    next = null;
                    if (attempt < 2) {
                      try {
                        Thread.sleep(500L * (attempt + 1));
                      } catch (InterruptedException interrupted) {
                        Thread.currentThread().interrupt();
                        throw new java.io.IOException("UPDATE_RETRY_INTERRUPTED", interrupted);
                      }
                    }
                  }
                }
                if (lastConnectionError != null) throw lastConnectionError;
                if (next == null) throw new java.io.IOException("UPDATE_CONNECTION_FAILED");
                if (status >= 300 && status < 400) {
                  String location = next.getHeaderField("Location");
                  next.disconnect();
                  if (location == null || location.trim().isEmpty()) throw new java.io.IOException("UPDATE_REDIRECT_MISSING_LOCATION");
                  current = new URL(current, location);
                  continue;
                }
                return next;
              }
              throw new java.io.IOException("UPDATE_REDIRECT_LIMIT");
            }

            @PluginMethod public void checkForUpdate(PluginCall call) {
              new Thread(() -> {
                HttpURLConnection connection = null;
                try {
                  connection = openTrustedConnection(MANIFEST, "application/json", 15000, 15000);
                  int status = connection.getResponseCode();
                  if (status != HttpURLConnection.HTTP_OK) {
                    throw new java.io.IOException("UPDATE_CHECK_HTTP_" + status);
                  }
                  Uri finalUri = Uri.parse(connection.getURL().toString());
                  String finalHost = finalUri.getHost();
                  if (!"https".equals(finalUri.getScheme()) || finalHost == null ||
                      !(finalHost.equalsIgnoreCase("github.com") ||
                        finalHost.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                        finalHost.equalsIgnoreCase("objects.githubusercontent.com"))) {
                    throw new java.io.IOException("UPDATE_REDIRECT_REJECTED");
                  }
                  try (InputStream input = connection.getInputStream();
                       java.io.ByteArrayOutputStream output = new java.io.ByteArrayOutputStream()) {
                    byte[] buffer = new byte[4096];
                    int count;
                    while ((count = input.read(buffer)) != -1) {
                      if (output.size() + count > 1024 * 1024) throw new java.io.IOException("UPDATE_MANIFEST_TOO_LARGE");
                      output.write(buffer, 0, count);
                    }
                    JSONObject manifest = new JSONObject(output.toString("UTF-8"));
                    String version = manifest.optString("version", "");
                    String url = manifest.optString("apkUrl", "");
                    String checksum = manifest.optString("sha256", "");
                    if (version.isEmpty() || (!url.startsWith(APK_PREFIX) && !url.startsWith(APK_LATEST_PREFIX)) || !checksum.matches("(?i)[0-9a-f]{64}")) {
                      throw new java.io.IOException("UPDATE_MANIFEST_INVALID");
                    }
                    JSObject result = new JSObject();
                    result.put("update", manifest);
                    call.resolve(result);
                  }
                } catch (Exception error) {
                  call.reject("UPDATE_CHECK_FAILED: " + error.getMessage(), error);
                } finally {
                  if (connection != null) connection.disconnect();
                }
              }).start();
            }

            @PluginMethod public void openInstallPermissionSettings(PluginCall call) {
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O ||
                  getContext().getPackageManager().canRequestPackageInstalls()) {
                JSObject result = new JSObject();
                result.put("permissionGranted", true);
                call.resolve(result);
                return;
              }
              getActivity().runOnUiThread(() -> {
                try {
                  Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                      Uri.parse("package:" + getContext().getPackageName()));
                  settings.addFlags(Intent.FLAG_ACTIVITY_NO_HISTORY);
                  getActivity().startActivity(settings);
                  JSObject result = new JSObject();
                  result.put("permissionGranted", false);
                  result.put("settingsOpened", true);
                  call.resolve(result);
                } catch (Exception error) {
                  call.reject("PERMISSION_SETTINGS_FAILED: " + error.getClass().getSimpleName() + ": " + error.getMessage(), error);
                }
              });
            }

            @PluginMethod public void installUpdate(PluginCall call) {
              String url = call.getString("url");
              String expected = call.getString("sha256");
              if (url == null || expected == null || !expected.matches("(?i)[0-9a-f]{64}")) {
                call.reject("UPDATE_INPUT_INVALID: Missing APK URL or SHA-256 checksum");
                return;
              }
              Uri source = Uri.parse(url);
              if (!"https".equals(source.getScheme()) ||
                  !"github.com".equalsIgnoreCase(source.getHost()) ||
                  source.getUserInfo() != null ||
                  source.getQuery() != null ||
                  source.getPath() == null ||
                  !(source.getPath().startsWith("/ashdas10/baro-pos-releases/releases/download/") ||
                    source.getPath().startsWith("/ashdas10/baro-pos-releases/releases/latest/download/"))) {
                call.reject("UPDATE_URL_REJECTED: APK URL is not an approved Baro POS release");
                return;
              }
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                  !getContext().getPackageManager().canRequestPackageInstalls()) {
                call.reject("INSTALL_PERMISSION_MISSING: Allow Baro POS to install unknown apps, return here, then tap Download & update again");
                return;
              }

              new Thread(() -> {
                HttpURLConnection connection = null;
                File temporary = new File(getContext().getCacheDir(), "baro-pos-update.apk.part");
                File apk = new File(getContext().getCacheDir(), "baro-pos-update.apk");
                String stage = "START";
                try {
                  temporary.delete();
                  stage = "CONNECT_AND_VALIDATE_REDIRECTS";
                  connection = openTrustedConnection(url, "application/vnd.android.package-archive, application/octet-stream", 20000, 45000);
                  stage = "CHECK_HTTP_RESPONSE";
                  int status = connection.getResponseCode();
                  if (status != HttpURLConnection.HTTP_OK) throw new java.io.IOException("APK_DOWNLOAD_HTTP_" + status);
                  Uri finalUri = Uri.parse(connection.getURL().toString());
                  String finalHost = finalUri.getHost();
                  if (!"https".equals(finalUri.getScheme()) || finalHost == null ||
                      !(finalHost.equalsIgnoreCase("github.com") ||
                        finalHost.equalsIgnoreCase("release-assets.githubusercontent.com") ||
                        finalHost.equalsIgnoreCase("objects.githubusercontent.com"))) {
                    throw new java.io.IOException("APK_REDIRECT_REJECTED");
                  }
                  String contentType = connection.getContentType();
                  if (connection.getContentLengthLong() > MAX_APK_BYTES) throw new java.io.IOException("APK_FILE_TOO_LARGE");
                  stage = "STREAM_APK_TO_TEMP_FILE";
                  MessageDigest digest = MessageDigest.getInstance("SHA-256");
                  long total = 0;
                  try (InputStream input = connection.getInputStream();
                       FileOutputStream output = new FileOutputStream(temporary)) {
                    byte[] buffer = new byte[16384];
                    int count;
                    while ((count = input.read(buffer)) != -1) {
                      total += count;
                      if (total > MAX_APK_BYTES) throw new java.io.IOException("APK_FILE_TOO_LARGE");
                      digest.update(buffer, 0, count);
                      output.write(buffer, 0, count);
                    }
                    output.flush();
                    output.getFD().sync();
                  }
                  stage = "VERIFY_SIZE_AND_SHA256";
                  if (total < 1024 * 1024) throw new java.io.IOException("APK_DOWNLOAD_TOO_SMALL");
                  StringBuilder actual = new StringBuilder();
                  for (byte value : digest.digest()) actual.append(String.format(java.util.Locale.US, "%02x", value));
                  if (!actual.toString().equalsIgnoreCase(expected)) throw new java.io.IOException("APK_CHECKSUM_MISMATCH");
                  stage = "FINALIZE_VERIFIED_APK_CACHE";
                  if (apk.exists() && !apk.delete()) throw new java.io.IOException("APK_CACHE_CLEANUP_FAILED");
                  if (!temporary.renameTo(apk)) throw new java.io.IOException("APK_CACHE_FINALIZE_FAILED");

                  stage = "OPEN_ANDROID_INSTALLER";
                  Uri apkUri = FileProvider.getUriForFile(getContext(),
                      getContext().getPackageName() + ".fileprovider", apk);
                  Intent install = new Intent(Intent.ACTION_INSTALL_PACKAGE);
                  install.setData(apkUri);
                  install.setClipData(android.content.ClipData.newRawUri("Baro POS update", apkUri));
                  install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                  final long downloadedBytes = total;
                  getActivity().runOnUiThread(() -> {
                    try {
                      getActivity().startActivity(install);
                      JSObject result = new JSObject();
                      result.put("installerLaunched", true);
                      result.put("bytesDownloaded", downloadedBytes);
                      call.resolve(result);
                    } catch (Exception error) {
                      call.reject("INSTALL_LAUNCH_FAILED: " + error.getClass().getSimpleName() + ": " + error.getMessage(), error);
                    }
                  });
                } catch (Exception error) {
                  temporary.delete();
                  call.reject("UPDATE_INSTALL_FAILED [" + stage + "]: " + error.getMessage(), error);
                } finally {
                  if (connection != null) connection.disconnect();
                }
              }).start();
            }
          }
          JAVA
          cat > android/app/src/main/res/xml/baro_file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="updates" path="." /></paths>
          XML
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if "REQUEST_INSTALL_PACKAGES" not in s:
              s=s.replace("<application", '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          provider='''        <provider android:name="androidx.core.content.FileProvider" android:authorities="APP_ID.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/baro_file_paths" /></provider>'''.replace("APP_ID.fileprovider", "$"+"{applicationId}.fileprovider")
          if "androidx.core.content.FileProvider" not in s: s=s.replace("</application>",provider+"\n    </application>",1)
          p.write_text(s)
          main=Path("android/app/src/main/java/com/baro/pos/MainActivity.java")
          if not main.exists():
              main.write_text("package com.baro.pos;\nimport com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\npublic class MainActivity extends BridgeActivity { @Override public void onCreate(Bundle savedInstanceState) { registerPlugin(ApkUpdaterPlugin.class); super.onCreate(savedInstanceState); } }\n")
          else:
              s=main.read_text()
              if "ApkUpdaterPlugin" not in s:
                  if "import com.getcapacitor.BridgeActivity;" in s: s=s.replace("import com.getcapacitor.BridgeActivity;","import com.getcapacitor.BridgeActivity;\nimport com.baro.pos.ApkUpdaterPlugin;")
                  s=re.sub(r"public class MainActivity extends BridgeActivity \{", "public class MainActivity extends BridgeActivity { @Override public void onCreate(android.os.Bundle savedInstanceState) { registerPlugin(ApkUpdaterPlugin.class); super.onCreate(savedInstanceState); }", s, count=1)
                  main.write_text(s)
          PY
      - name: Inject Android section security and native local notifications into production APK
        run: python3 scripts/inject-android-section-security-and-notifications.py
      - name: Apply Baro POS app branding
        run: |
          sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">Baro POS<\/string>/' android/app/src/main/res/values/strings.xml || true
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir, readdir, writeFile } from 'node:fs/promises';
          const res = 'android/app/src/main/res';
          const densities = {
            mdpi: { legacy: 48, adaptive: 108 },
            hdpi: { legacy: 72, adaptive: 162 },
            xhdpi: { legacy: 96, adaptive: 216 },
            xxhdpi: { legacy: 144, adaptive: 324 },
            xxxhdpi: { legacy: 192, adaptive: 432 },
          };
          const dirs = (await readdir(res, { withFileTypes: true }))
            .filter(entry => entry.isDirectory() && /^mipmap-(mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi)$/.test(entry.name))
            .map(entry => entry.name);
          for (const dir of dirs) {
            const density = dir.replace('mipmap-', '');
            const { legacy, adaptive } = densities[density];
            // The Brand Pack's Android foreground uses a generous adaptive safe
            // zone: 44.4% width x 45.8% height, not the old oversized 72% mark.
            const mark = await sharp('public/brand/baro-mark-black.svg')
              .resize({ width: Math.round(adaptive * 0.444), height: Math.round(adaptive * 0.458), fit: 'fill' })
              .png().toBuffer();
            const foreground = await sharp({
              create: { width: adaptive, height: adaptive, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } }
            }).composite([{ input: mark, gravity: 'centre' }]).png().toBuffer();
            const monochrome = await sharp(foreground).tint({ r: 0, g: 0, b: 0 }).png().toBuffer();
            await writeFile(`${res}/${dir}/ic_launcher_foreground.png`, foreground);
            await writeFile(`${res}/${dir}/ic_launcher_monochrome.png`, monochrome);
            const legacyIcon = await sharp({ create: { width: legacy, height: legacy, channels: 4, background: '#FF5B2E' } })
              .composite([{ input: await sharp(foreground).resize(legacy, legacy).png().toBuffer() }])
              .png().toBuffer();
            await writeFile(`${res}/${dir}/ic_launcher.png`, legacyIcon);
            await writeFile(`${res}/${dir}/ic_launcher_round.png`, legacyIcon);
          }
          const adaptiveDir = `${res}/mipmap-anydpi-v26`;
          await mkdir(adaptiveDir, { recursive: true });
          const adaptiveXml = `<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
              <monochrome android:drawable="@mipmap/ic_launcher_monochrome"/>
          </adaptive-icon>`;
          await writeFile(`${adaptiveDir}/ic_launcher.xml`, adaptiveXml);
          await writeFile(`${adaptiveDir}/ic_launcher_round.xml`, adaptiveXml);
          const valuesDir = `${res}/values`;
          await mkdir(valuesDir, { recursive: true });
          await writeFile(`${valuesDir}/ic_launcher_background.xml`,
            `<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#FF5B2E</color></resources>`);
          NODE
      - name: Set app version from package.json
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          VERSION="$(node -e "const fs=require('fs'); const s=fs.readFileSync('src/App.tsx','utf8'); const m=s.match(/const APP_VERSION = '([^']+)'/); if (!m) process.exit(2); console.log(m[1])")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid app version: $VERSION"
            exit 1
          fi
          if [[ "$VERSION" != "$PACKAGE_VERSION" && "$VERSION" != "$PACKAGE_VERSION".* ]]; then
            echo "App version $VERSION must match package version $PACKAGE_VERSION or its patch suffix"
            exit 1
          fi
          VERSION_CODE="$(node -e "const [a,b,c,d=0]=process.argv[1].split('.').map(Number); console.log(a*1000000+b*10000+c*100+d)" "$VERSION")"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi
          echo "BARO_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BARO_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName '$VERSION'/" android/app/build.gradle
      - name: Restore permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/baro-pos-release.jks
          test -s android/app/baro-pos-release.jks
      - name: Configure release signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          if "signingConfigs {" in text:
              raise SystemExit("Signing configuration already exists; refusing to duplicate it.")
          if "android {" not in text or "buildTypes {" not in text:
              raise SystemExit("Unexpected Gradle file structure; signing configuration was not changed.")
          text = text.replace("android {", """android {
              signingConfigs {
                  release {
                      storeFile file("baro-pos-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """, 1)
          import re
          marker = "buildTypes {"
          if marker not in text:
              raise SystemExit("Gradle buildTypes block not found; signing configuration was not changed.")
          before, after = text.split(marker, 1)
          match = re.search(r'(?m)^(\s*)(?:release|getByName\(["\']release["\']\))\s*\{', after)
          if match:
              indent = match.group(1)
              after = after[:match.end()] + "\n" + indent + "    signingConfig signingConfigs.release" + after[match.end():]
          else:
              after = "\n    release {\n        signingConfig signingConfigs.release\n    }\n" + after
          path.write_text(before + marker + after)
          PY
      - name: Increase Gradle distribution download timeout
